    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.salt),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.iv)},key,u8(P.data)));
    try{localStorage.setItem(K,pw)}catch(e){}
    document.open();document.write(html);document.close();
  }
  var f=document.getElementById('pg');
  f.addEventListener('submit',function(e){e.preventDefault();
    open(document.getElementById('pw').value).catch(function(){document.getElementById('err').textContent='Неверный пароль'})});
  var saved=null;try{saved=localStorage.getItem(K)}catch(e){}
  if(saved){open(saved).catch(function(){f.style.display='block'})}else{f.style.display='block'}
})();
